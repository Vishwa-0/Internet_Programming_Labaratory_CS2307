<!DOCTYPE html>
<html>
<head>
    <title>Session Tracking - Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 60px; background-color: #f4f6f8; }
        .box { background: #fff; padding: 25px 35px; border-radius: 8px;
               box-shadow: 0 0 10px rgba(0,0,0,0.15); max-width: 400px; margin: auto; text-align:center;}
        input[type="text"], input[type="password"] { padding: 6px; width: 80%; margin: 10px 0; }
        input[type="submit"] { background-color: #2c3e50; color: #fff; border: none;
                                padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Login</h2>
        <form action="WelcomeServlet" method="post">
            Name: <br><input type="text" name="uname"><br>
            Password: <br><input type="password" name="password"><br>
            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
